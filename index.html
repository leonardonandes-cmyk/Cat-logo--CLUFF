<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cluff · Freedom & Comfort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#f8efd0;
    --creme-forte:#ecdca4;
    --marinho:#152532;
    --marinho-fundo:#0a141c;
    --wpp:#25d366;
    --shopee:#ee4d2d;
    --ig:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Baloo 2',system-ui,sans-serif;
    background:var(--creme);
    color:var(--marinho);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:22px 16px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .page{width:100%;max-width:440px}

  /* ---------- HERO / CAPA ---------- */
  .hero{
    position:relative;
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 18px 44px rgba(21,37,50,.22);
    line-height:0;
  }
  .hero img{
    width:100%;
    height:auto;
    display:block;
    object-fit:cover;
  }
  .hero .veu{
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(10,20,28,.55) 0%, rgba(10,20,28,0) 42%);
    pointer-events:none;
  }
  .hero .marca{
    position:absolute;
    left:22px;
    bottom:20px;
    color:#fff;
    line-height:1;
    text-shadow:0 2px 14px rgba(0,0,0,.35);
  }
  .hero .marca h1{
    font-size:42px;
    font-weight:800;
    letter-spacing:.5px;
  }
  .hero .marca span{
    display:block;
    margin-top:4px;
    font-size:14px;
    font-weight:500;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:.92;
  }

  /* ---------- BLOCOS ---------- */
  .bloco{margin-top:26px}
  .rotulo{
    text-align:center;
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--marinho);
    margin-bottom:14px;
    position:relative;
  }
  .rotulo::after{
    content:"";
    display:block;
    width:38px;height:3px;
    background:var(--creme-forte);
    border-radius:3px;
    margin:9px auto 0;
  }

  /* ---------- BOTÕES 3D ---------- */
  .btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:11px;
    width:100%;
    padding:17px 20px;
    margin-bottom:14px;
    border:none;
    border-radius:16px;
    font-family:inherit;
    font-size:17px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    overflow:hidden;
    transition:transform .08s ease, box-shadow .08s ease;
    z-index:1;
  }
  .btn .fill{
    position:absolute;
    inset:0;
    width:0;
    z-index:-1;
    transition:width .28s ease;
  }
  .btn:hover .fill{width:100%}
  .btn .txt{position:relative;z-index:2;display:flex;align-items:center;gap:11px}
  .btn svg{width:22px;height:22px;flex:none}
  .btn:active{transform:translateY(6px)}

  /* WhatsApp — marinho, hover verde */
  .btn.wpp{
    background:var(--marinho);
    color:var(--creme);
    box-shadow:0 6px 0 var(--marinho-fundo);
  }
  .btn.wpp .fill{background:var(--wpp)}
  .btn.wpp:hover{color:#fff}
  .btn.wpp:active{box-shadow:0 0 0 var(--marinho-fundo)}

  /* Shopee — creme forte, hover laranja */
  .btn.shopee{
    background:var(--creme-forte);
    color:var(--marinho);
    box-shadow:0 6px 0 #cdb877;
  }
  .btn.shopee .fill{background:var(--shopee)}
  .btn.shopee:hover{color:#fff}
  .btn.shopee:active{box-shadow:0 0 0 #cdb877}

  /* Instagram — creme forte, hover degradê */
  .btn.ig{
    background:var(--creme-forte);
    color:var(--marinho);
    box-shadow:0 6px 0 #cdb877;
  }
  .btn.ig .fill{background:var(--ig)}
  .btn.ig:hover{color:#fff}
  .btn.ig:active{box-shadow:0 0 0 #cdb877}

  /* ---------- REVENDA ---------- */
  .revenda{
    margin-top:30px;
    text-align:center;
    padding:22px 18px;
    border-radius:20px;
    background:rgba(21,37,50,.05);
  }
  .revenda a{
    text-decoration:none;
    color:var(--marinho);
    display:block;
    transition:color .2s ease;
  }
  .revenda a:hover{color:var(--wpp)}
  .revenda .titulo{font-size:19px;font-weight:800;letter-spacing:.4px}
  .revenda .frase{font-size:14px;font-weight:500;margin-top:6px;opacity:.85}

  /* ---------- ASSINATURA ---------- */
  .assinatura{
    text-align:center;
    margin-top:26px;
    font-size:13px;
    font-weight:600;
    letter-spacing:1.5px;
    color:var(--marinho);
    opacity:.7;
  }

  @media (prefers-reduced-motion: reduce){
    .btn,.btn .fill{transition:none}
  }
</style>
</head>
